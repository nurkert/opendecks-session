# Views, layouts and panels with their required elements (SPEC §16.3).
# Labels follow the convention in docs/parity.md; the UI sets them as `accessible-label`.

[meta]
source = "SPEC §12 layout"
label_grammar = "<scope>[n].<part>[.<part>…], parts lower-case kebab-case, last part may be a pad letter A–H"

[[size]]
id = "desktop"
width = 1440
height = 900
min_target = 24
note = "UX study reference size (1442 x 901 pt)"

[[size]]
id = "laptop"
width = 1280
height = 800
min_target = 24
note = "13\" laptop"

[[size]]
id = "kiosk"
width = 800
height = 480
min_target = 44
note = "Raspberry Pi touchscreen, Perform; touch targets ≥ 9 mm (SPEC §12)"

[[invariant]]
id = "present"
description = "every required label exists in the view"

[[invariant]]
id = "visible"
description = "every required element is visible (non-zero size, not hidden, opacity > 0)"

[[invariant]]
id = "unclipped"
description = "every required element lies fully inside its parent and the window"

[[invariant]]
id = "no-overlap"
description = "no required element overlaps a sibling"
tolerance_px = 0

[[invariant]]
id = "order"
description = "elements appear in the listed order along the region's axis (row: left edges, column: top edges, grid: row-major)"
tolerance_px = 1

[[invariant]]
id = "in-region"
description = "elements lie inside their region and the region inside its band; bands stack top to bottom in the listed order"
tolerance_px = 1

[[invariant]]
id = "min-target"
description = "interactive elements are at least `min_target` px on both edges at the given size"

[[invariant]]
id = "rules-align"
description = "shared 1 px rules line up across panes"
tolerance_px = 1

[[invariant]]
id = "no-elision"
description = "no text is elided where the full text fits"

[[invariant]]
id = "contrast-text"
description = "text contrast ≥ 4.5:1"
min_ratio = 4.5

[[invariant]]
id = "contrast-large"
description = "large text contrast ≥ 3:1"
min_ratio = 3.0

[[invariant]]
id = "no-horizontal-scroll"
description = "the window never scrolls horizontally"

[[invariant]]
id = "fixed-bands"
description = "bands other than the browser keep their height when the window grows; the browser takes the rest (UX §1.1)"
tolerance_px = 1

[[invariant]]
id = "disabled-dimmed"
description = "unavailable controls are dimmed in place, never hidden (UX §3)"

[[invariant]]
id = "scale-range"
description = "the view passes all invariants at UI scale 0.75, 1.0, 1.5 and 2.0 (SPEC §16.4)"

[[invariant]]
id = "no-modal-in-perform"
description = "no modal dialog opens while a deck plays in Perform (SPEC §12, §16.4)"

