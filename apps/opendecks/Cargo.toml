[package]
name = "opendecks"
description = "OpenDecks Session: prepare, sync and perform"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opendecks"
path = "src/main.rs"

[features]
kiosk = ["od-ui/kiosk"]

[dependencies]
od-ui.workspace = true
od-core.workspace = true
od-library.workspace = true
od-i18n.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
slint = "1.18"

[package.metadata.deb]
name = "opendecks-session"
maintainer = "OpenDecks Session contributors"
copyright = "OpenDecks Session contributors, GPL-3.0-or-later"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Open-source DJ software: prepare your library and sets, keep USB sticks in \
sync automatically (Pioneer DJ export and OpenDecks format), record mixes \
and perform with Pioneer DJ controllers (DDJ-FLX10, DDJ-FLX4)."""
section = "sound"
priority = "optional"
depends = "$auto, udisks2"
assets = [
    ["target/release/opendecks", "usr/bin/", "755"],
    ["target/release/od-cli", "usr/bin/", "755"],
    ["target/release/opendecks-mcp", "usr/bin/", "755"],
    ["../../mappings/**/*", "usr/share/opendecks/mappings/", "644"],
    ["../../packaging/linux/opendecks.desktop", "usr/share/applications/org.opendecks.Session.desktop", "644"],
    ["../../packaging/assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/opendecks.svg", "644"],
    ["../../packaging/assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/opendecks.png", "644"],
    ["../../README.md", "usr/share/doc/opendecks-session/README.md", "644"],
]
