[package]
name = "od-mcp"
description = "MCP server: gives an LLM client access to the OpenDecks Session library for preparing sets"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opendecks-mcp"
path = "src/main.rs"

[dependencies]
od-core.workspace = true
od-library.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std", "net", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[dev-dependencies]
tempfile.workspace = true
