# OpenDecks Session controller mapping: Pioneer DJ DDJ-FLX10 (4 decks)
#
# SPDX-License-Identifier: GPL-3.0-or-later
# Authored independently for OpenDecks Session in its own schema (see
# docs/controller-mappings.md). "Pioneer DJ" and "DDJ-FLX10" are used only to
# name the hardware this file is compatible with.
#
# Sources of the MIDI message facts:
#   [R] Message list observed in the MIDI assignment table shipped with
#       rekordbox 7 for this controller (read as an interoperability
#       reference only; nothing of that file is reproduced here).
#   [M] Mixxx project mappings of the same controller family (DDJ-FLX4),
#       for shared Pioneer conventions: offset-64 jog encoding, 14-bit LSB
#       = MSB + 0x20, pad note blocks per pad mode.
#   [P] Pioneer DJ "MIDI message list" PDF for the DDJ-FLX10 (pioneerdj.com
#       support documents) — to be cross-checked; not yet retrieved.
#
# The unit was not connected while this file was written, so nothing here
# has been captured live. Entries marked `verify = true` are inferred
# (e.g. from the shared Pioneer layout) or are messages rekordbox does not
# use itself; all others are listed in [R]. Confirm everything with:
#   cargo run -p od-controller --example midi_monitor -- --mapping mappings/pioneer/ddj-flx10.toml
#
# Wire channels: decks 1–4 = 0–3; pads deck 1–4 = 7, 9, 11, 13 (shift
# 8, 10, 12, 14); beat FX = 4; global mixer/browser = 6; indicators = 15.
# The DECK 1/3 and DECK 2/4 buttons switch layers in hardware: the unit
# then sends on the channel of the selected deck, so channel sets name decks
# directly and `[layers] mode = "hardware"` only tracks the active deck (for
# soft takeover of the tempo fader after a layer switch).

schema = 1

[device]
id = "pioneer-ddj-flx10"
name = "DDJ-FLX10"
vendor = "Pioneer DJ"
model = "DDJ-FLX10"
decks = 4
module = "pioneer-ddj"
sources = [
  "rekordbox 7 MIDI assignment table for DDJ-FLX10 (facts only)",
  "Mixxx Pioneer DDJ mappings (shared conventions, facts only)",
  "Pioneer DJ DDJ-FLX10 MIDI message list (pending cross-check)",
]

[device.match]
port_names = ["DDJ-FLX10"]
usb_vendor_id = 0x2B73
usb_product_id = 0x0041

[channels]
deck = [0, 1, 2, 3]
pad = [7, 9, 11, 13]
pad_shift = [8, 10, 12, 14]

[layers]
mode = "hardware"
sides = [[1, 3], [2, 4]]

[options]
soft_takeover = true
takeover_threshold = 0.03
jog_ticks_per_revolution = 720   # verify on hardware
meter_interval_ms = 33

# Placeholder pad colour palette (velocity value -> colour). The real
# velocity/colour table has to be measured with `midi_monitor --leds`.
