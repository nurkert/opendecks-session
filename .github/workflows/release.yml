name: Release

on:
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - run: brew install rubberband pkg-config
      - run: packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos-dmg, path: target/dist/*.dmg }

  linux:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: packaging/linux/install-build-deps.sh
      - run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: appimage-${{ matrix.os }}, path: target/dist/*.AppImage }

  raspberry-pi:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: packaging/linux/install-build-deps.sh
      - run: packaging/raspberry-pi/build-bundle.sh
      - uses: actions/upload-artifact@v4
        with: { name: raspberry-pi-bundle, path: target/dist/*.tar.gz }
