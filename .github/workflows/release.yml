name: Release

on:
  push:
    tags: ["v*"]
  # A manual run builds the Linux packages only unless macos is ticked
  # (macOS runners are expensive on a free account).
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build the macOS disk images"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    if: github.event_name == 'push' || inputs.macos
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install rubberband pkg-config dylibbundler
      - name: Build app and disk image
        run: packaging/macos/build-dmg.sh
      - name: Smoke test the bundled app
        run: |
          hdiutil attach target/dist/*.dmg -mountpoint /tmp/od -nobrowse
          "/tmp/od/OpenDecks Session.app/Contents/MacOS/opendecks" --help
          "/tmp/od/OpenDecks Session.app/Contents/MacOS/od-cli" --version
          "/tmp/od/OpenDecks Session.app/Contents/MacOS/opendecks-mcp" --version
          hdiutil detach /tmp/od
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.os }}
          path: target/dist/*.dmg

  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Ubuntu 24.04 (glibc 2.39): the ONNX Runtime used for stem separation
    # needs glibc 2.38. Packages run on Ubuntu 24.04+, Debian 13+ and
    # Raspberry Pi OS (64-bit, trixie).
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
      - uses: actions/checkout@v4
      - run: packaging/linux/install-build-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build .deb, AppImage and tar.gz
        run: packaging/linux/build-packages.sh
      - name: Smoke test the .deb
        run: |
          apt-get install -y ./target/dist/opendecks-session_*.deb
          opendecks --help
          od-cli --version
          opendecks-mcp --version
          test -f /usr/share/opendecks/mappings/pioneer/ddj-flx10.toml
      - name: Raspberry Pi kiosk bundle
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: packaging/raspberry-pi/build-bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: |
            target/dist/*.deb
            target/dist/*.AppImage
            target/dist/*.tar.gz

  publish:
    needs: [macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "OpenDecks Session ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/release-notes.md
