name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest    # Apple Silicon
          - os: macos-15-intel  # Intel
          - os: ubuntu-24.04    # x86_64
          - os: ubuntu-24.04-arm  # aarch64 (Raspberry Pi class)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install rubberband pkg-config
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/install-build-deps.sh
      - name: Test
        run: cargo test --workspace --locked
      - name: Linux audio backends (JACK, PipeWire)
        if: runner.os == 'Linux'
        run: cargo test --locked -p od-audio-io --features jack,pipewire
      - name: Build release
        run: cargo build --release --locked -p opendecks -p od-cli

  # SPEC §16 gap report. Non-blocking until the gap count reaches zero
  # (docs/parity.md, "Becoming the CI gate"); the always-enforced parity
  # tests run in the test job above.
  parity:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: packaging/linux/install-build-deps.sh
      # Headless UI suites (Slint testing backend, no display): view
      # completeness at every size and the superiority flows. Report-only
      # unless OD_PARITY_STRICT=1; they write target/parity/ for the report.
      - name: View completeness and flows
        run: cargo test --locked -p od-ui --lib ui_tests -- --nocapture
      - name: Parity gap report
        run: |
          cargo run --locked -p od-parity --bin parity -- check --out parity-report.md
      - name: Job summary
        if: always()
        run: test -f parity-report.md && cat parity-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report
          path: |
            parity-report.md
            target/parity/
          if-no-files-found: warn

  kiosk:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: packaging/linux/install-build-deps.sh
      - name: Build kiosk binary (Raspberry Pi 4/5)
        run: cargo build --release --locked -p opendecks --features kiosk
      - name: Headless end-to-end on aarch64 (import, Lite analysis, stick sync)
        run: cargo build --release --locked -p od-cli && packaging/ci/headless-e2e.sh
      - uses: actions/upload-artifact@v4
        with:
          name: opendecks-kiosk-aarch64
          path: target/release/opendecks
