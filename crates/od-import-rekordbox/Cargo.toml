[package]
name = "od-import-rekordbox"
description = "One-time migration of a rekordbox library (master.db or an exported USB stick) into OpenDecks Session"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
od-core.workspace = true
od-library.workspace = true
od-decode.workspace = true
od-format-pioneer.workspace = true
# Plain bundled SQLite, same features as od-library. The SQLCipher layer of
# master.db is removed by our own pure-Rust page decryption (see
# `sqlcipher.rs`), so the workspace never links a second SQLite flavour.
rusqlite = { workspace = true }
serde.workspace = true
thiserror.workspace = true
quick-xml = "0.37"
tracing.workspace = true
tempfile.workspace = true
# Pure-Rust crypto for SQLCipher 4 pages (AES-256-CBC, HMAC-SHA512, PBKDF2).
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
