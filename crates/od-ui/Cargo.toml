[package]
name = "od-ui"
description = "Slint user interface of OpenDecks Session"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = ["separation"]
# Stem separation on this machine (ONNX Runtime). Without it, stems that were
# separated elsewhere still play.
separation = ["od-stems/separation"]
# Full-screen kiosk on the Raspberry Pi (no desktop environment).
kiosk = ["slint/backend-linuxkms-noseat", "slint/renderer-femtovg"]

[dependencies]
od-core.workspace = true
od-library.workspace = true
od-decode.workspace = true
od-analysis.workspace = true
od-devices.workspace = true
od-format-native.workspace = true
od-format-pioneer.workspace = true
slint = "1.18"
anyhow.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
rayon.workspace = true
od-engine.workspace = true
od-audio-io.workspace = true
od-controller.workspace = true
od-recorder.workspace = true
od-stems = { workspace = true, default-features = false }
od-i18n.workspace = true
od-update.workspace = true
od-lighting.workspace = true
od-import-rekordbox.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
rfd = "0.15"
symphonia.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Headless UI tests: the Slint testing backend (must match the slint version).
i-slint-backend-testing = "=1.18.1"
hound = "3"
od-parity = { path = "../od-parity" }

[build-dependencies]
slint-build = "1.18"
